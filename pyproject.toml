[project]
name = "target-fulfil"
version = "0.1.0"
description = "`target-fulfil` is a Singer target for Fulfil, built with the Meltano SDK for Singer Targets."
authors = [{ name = "Hassan Syyid", email = "hassan@hotglue.io" }]
keywords = [
    "ELT",
    "fulfil",
]
license = "Apache-2.0"
requires-python = "<3.11,>=3.7.1"
dependencies = [
    "requests>=2.25.1",
    "hotglue-singer-sdk>=1.0.11",
]

[project.scripts]
target-fulfil = 'target_fulfil.target:TargetFulfil.cli'

[dependency-groups]
dev = [
    "pytest>=7",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
required-version = ">=0.15"

[tool.ruff.lint]
future-annotations = true
ignore = [
    "COM812",
    "CPY001",
    "FIX002",
    "TD002",
    "TD003",
]
select = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
  "ANN001",
  "ANN201",
  "ARG005",
  "D103",
]
"target_fulfil/client.py" = [
    "ANN401",
    "ARG002",
    "D102",
    "EM102",
    "I001",
    "SLF001",
    "TRY003",
]
"target_fulfil/sinks.py" = [
    "ANN201",
    "ARG002",
    "D102",
    "EM102",
    "I001",
    "TRY003",
]
"target_fulfil/target.py" = [
    "RUF012",
    "I001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"
